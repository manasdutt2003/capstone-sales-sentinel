# Sales Sentinel pipeline configuration.
# Relative paths are resolved against THIS file's directory (SPEC R-ING-01).
# CLI flags and SALES_SENTINEL_* environment variables override these values.

[paths]
input = "../data/sample_sales_data.csv"
output_dir = "../output"

[dates]
order = "MDY"                 # MDY | DMY — how to read a/b/yyyy dates (R-DATE-02)
business_date = ""            # "" = infer modal date of the batch (R-DATE-04)
max_age_days = 7              # older than business_date - 7 days -> DATE_OUT_OF_WINDOW
future_tolerance_days = 0     # later than business_date + 0 days -> DATE_OUT_OF_WINDOW

[amounts]
max_amount = "100000.00"      # string so it is parsed as Decimal, not float (R-AMT-06)
missing_strategy = "group_median"   # group_median | quarantine (R-IMP-01)
min_group_size = 3
outlier_z = 3.5               # robust z threshold, flag only (R-AMT-08)

[dedupe]
policy = "content"            # content | id (R-DUP-03)
burst_threshold = 5           # clusters >= this size are reported as replay bursts (R-DUP-05)

[domain]
categories = ["Electronics", "Clothing", "Grocery"]

[domain.category_aliases]     # left side is matched case-insensitively (R-CAT-01)
electronic = "Electronics"
electronics = "Electronics"
apparel = "Clothing"
clothes = "Clothing"
groceries = "Grocery"
food = "Grocery"

[scoring.weights]             # must sum to 1.0 (R-SCORE-01)
completeness = 0.30
validity = 0.30
consistency = 0.15
uniqueness = 0.25

[quality_gate]                # only enforced with --strict (R-OPS-01)
max_quarantine_rate = 0.10
min_score = 60
